name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zoomies/package-lock.json
      - run: npm ci && npm run build
        working-directory: zoomies
      - run: mkdir _site && cp -r zoomies/dist _site/zoomies
      - name: Send the site root to the only game, until the hub page exists
        run: test -f index.html || echo '<meta http-equiv="refresh" content="0; url=zoomies/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
