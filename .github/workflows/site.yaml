name: site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Install the hub and the browser its tests use
        working-directory: hub
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test and build each game folder into _site
        run: |
          for dir in */; do
            dir=${dir%/}
            [ "$dir" = hub ] && continue
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm ci && npm test --if-present && npm run build && npm run e2e --if-present)
              mkdir -p _site && cp -r "$dir/dist" "_site/$dir"
            else
              mkdir -p _site && cp -r "$dir" "_site/$dir"
            fi
            [ -f "_site/$dir/game.json" ] || { echo "::error::$dir has no game.json"; exit 1; }
          done
      - name: Add the hub and its catalog
        run: |
          cp -r hub/site/. _site/
          node hub/catalog.mjs _site
      - name: Test the hub
        working-directory: hub
        run: |
          npm test
          npm run e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
